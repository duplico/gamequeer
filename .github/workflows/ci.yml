name: CI

on:
  push:
    branches: ["default"]
  pull_request:
    branches: ["default"]
  schedule:
    # Nightly full golden-compile suite (gamequeer#333/#329): runs the
    # ffmpeg-gated golden cases gqc-tests skips on its bare runner, inside
    # the gamequeer-builder image whose pinned ffmpeg they were captured
    # against, plus a source/cart drift check. 09:00 UTC is off-peak for
    # both GitHub's shared runners and this project's contributors.
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Lets a maintainer trigger golden-nightly on demand instead of waiting
    # for the schedule, e.g. to validate a change to it.

jobs:
  gqc-tests:
    name: gqc Python compiler tests
    runs-on: ubuntu-latest
    # schedule/workflow_dispatch (added for golden-nightly below) would
    # otherwise also trigger this and every other pre-existing job in this
    # workflow, since those events apply at the workflow level.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        # gamequeer has no submodules; omit submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        # Needed by the `ffmpeg`-marked animation grammar tests, which convert
        # a real (small) GIF fixture through gqc's ffmpeg-python path. Installed
        # explicitly rather than relying on it already being present in the
        # runner image, matching how this workflow's other jobs install their
        # own build deps (cmake, libx11-dev) rather than assuming ambient tools.
        # This apt package's version doesn't match the gamequeer-builder
        # image's pinned ffmpeg (see golden-nightly below), so
        # test_golden_compile.py's asset-bearing cases detect the mismatch
        # and skip themselves here rather than byte-comparing against it.
        run: sudo apt-get update -q && sudo apt-get install -y ffmpeg

      - name: Install gqc (editable, with test deps)
        run: pip install -e "gqc/[test]"

      - name: Run pytest
        # Real tests now exist (gamequeer#331); a bare `pytest tests` fails on
        # zero collected items (exit 5) same as any other test failure or
        # error, with no special-casing.
        run: pytest tests
        working-directory: gqc/

  gq-game-language-tests:
    name: gq-game-language vitest suite
    runs-on: ubuntu-latest
    # See gqc-tests' matching `if:` above: keeps this job off the new
    # schedule/workflow_dispatch triggers, which only golden-nightly needs.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        # Matches gq-game-language/install-langium-deps.sh's `nvm install 20`
        # (the version its Docker-based dev setup uses); package.json places
        # no floor on engines.node.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gq-game-language/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gq-game-language/

      - name: Generate Langium artifacts
        # test/*.test.ts import from src/language/generated/, which is
        # gitignored and produced by this step (see langium-quickstart.md).
        run: npm run langium:generate
        working-directory: gq-game-language/

      - name: Run vitest suite
        # No Docker/submodules needed: vitest only needs Node, and
        # test/golden.test.ts's fixture sweep reads .gq files straight from
        # this checkout (gamequeer/tests/golden/, examples/games/,
        # gqc/examples/skel/games/working_samples/ -- all plain paths
        # relative to the repo root, no submodule required).
        run: npm test
        working-directory: gq-game-language/

  gamequeer-vm-build:
    name: gamequeer C VM native build + headless golden suite
    runs-on: ubuntu-latest
    # See gqc-tests' matching `if:` above: keeps this job off the new
    # schedule/workflow_dispatch triggers, which only golden-nightly needs.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          # cmake: build system; libx11-dev: required by the Linux HAL / gfx layer.
          # libm is part of libc on glibc systems and needs no separate package.
          sudo apt-get install -y cmake libx11-dev

      - name: Configure (CMake)
        # Native host build — faster than the repo's Docker path
        # (make builder-build && make), and sufficient for verifying the VM
        # sources compile.  The Docker path remains available as a fallback
        # for a fully-reproducible environment.
        run: cmake -B build
        working-directory: gamequeer/

      - name: Build
        run: cmake --build build --parallel
        working-directory: gamequeer/

      - name: Configure headless build (golden framebuffer suite)
        # GQ_HEADLESS swaps the X11 gfx backend for a no-op stub (see
        # src/gfx/gfx_headless.c), so this configure step itself needs no
        # extra apt packages. libx11-dev was already installed above, but
        # only for the earlier native build — it (and a DISPLAY) is not
        # required for this headless one.
        # This also registers the tests/ CTest tree (see CMakeLists.txt: only
        # added when GQ_HEADLESS=ON), which runs the golden-framebuffer
        # regression suite (gamequeer#268/#270/#275) against the .gqgame
        # fixtures already committed under tests/golden/.
        run: cmake -B build-headless -DGQ_HEADLESS=ON
        working-directory: gamequeer/

      - name: Build (headless)
        run: cmake --build build-headless --parallel
        working-directory: gamequeer/

      - name: Run golden framebuffer regression suite
        run: ctest --output-on-failure
        working-directory: gamequeer/build-headless

  gamequeer-vm-build-instrumented:
    name: gamequeer C VM instrumented (GQ_PERF_INSTRUMENT_RUNS) golden suite
    runs-on: ubuntu-latest
    # See gqc-tests' matching `if:` above: keeps this job off the new
    # schedule/workflow_dispatch triggers, which only golden-nightly needs.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # No libx11-dev needed here: this job only ever configures
          # GQ_HEADLESS=ON (see below), which swaps in the no-op X11 stub
          # (src/gfx/gfx_headless.c) -- same as gamequeer-vm-build's headless
          # step above.
          sudo apt-get update -q
          sudo apt-get install -y cmake

      - name: Configure (CMake, headless + GQ_PERF_INSTRUMENT + GQ_PERF_INSTRUMENT_RUNS)
        # This is the leg gamequeer#307 was filed for: gamequeer-vm-build
        # above only ever configures plain GQ_HEADLESS=ON, so the
        # GQ_PERF_INSTRUMENT_RUNS-gated ctests (perf_draw_count_cross_check,
        # perf_row_blit_draw_{write,decode}_count, perf_mask_row_blit_draw_
        # {write,decode}_count, and any future GQ_PERF_INSTRUMENT_RUNS-gated
        # test) never ran in CI at all -- the plain golden suite proves
        # pixel identity either way, but only these instrumented tests catch
        # a regression that silently defeats a fast path's engagement gate
        # (verified empirically during the #306/#310/#313 review rounds --
        # the PRs that introduced the row blit, row decode advance, and
        # masked row blit fast paths -- forcing a fast-path gate off still
        # passes every pixel golden; only the instrumented count tests
        # fail). GQ_PERF_INSTRUMENT_RUNS requires
        # GQ_PERF_INSTRUMENT (see gq_perf.h's own doc comment) -- both are
        # set here, deliberately not relying on GQ_PERF_INSTRUMENT_RUNS's
        # implicit default.
        run: cmake -B build-headless -DGQ_HEADLESS=ON -DGQ_PERF_INSTRUMENT=ON -DGQ_PERF_INSTRUMENT_RUNS=ON
        working-directory: gamequeer/

      - name: Build (instrumented)
        run: cmake --build build-headless --parallel
        working-directory: gamequeer/

      - name: Run full ctest suite (instrumented)
        # Deliberately does NOT hardcode an expected test count -- the
        # instrumented suite has already grown once (26 when gamequeer#307
        # was filed, 27 on `default` as of this PR) and will keep growing
        # as more GQ_PERF_INSTRUMENT_RUNS-gated tests are added (e.g.
        # gamequeer#313's masked row-blit engagement tests, still in
        # review as of this writing). `ctest` itself already fails the job
        # on any individual test failure; asserting a specific total count
        # here would just be one more place to remember to update per PR --
        # the leg's job is to run every registered test, not to know in
        # advance how many there are.
        run: ctest --output-on-failure
        working-directory: gamequeer/build-headless

  golden-nightly:
    name: Nightly full golden-compile suite (gamequeer-builder image)
    runs-on: ubuntu-latest
    # Only the ffmpeg-gated golden cases (gqc/tests/test_golden_compile.py)
    # need this job: they skip on gqc-tests' bare runner because its apt
    # ffmpeg doesn't match the fixtures' pinned build. Gated to schedule/
    # workflow_dispatch so it doesn't also run (redundantly, and slowly --
    # it builds the whole builder image) on every push/pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Build gamequeer-builder image
        # Built in-job rather than pulled from a registry: gamequeer doesn't
        # currently publish this image anywhere, and Docker's local layer
        # cache keeps a same-runner rebuild cheap after the first nightly
        # run pays the full cost. The tradeoff is a slower job (and no
        # cross-runner cache reuse, since GitHub-hosted runners are
        # ephemeral) versus standing up registry storage and credentials
        # for an image that's otherwise only ever built and used locally.
        run: make builder-build

      - name: Run full gqc pytest suite in the builder image
        # Runs every gqc test, including the ffmpeg-gated golden cases that
        # gqc-tests (different, bare-runner ffmpeg build) skips.
        run: |
          docker run --rm --workdir /workspaces/gamequeer \
            -v "$PWD":/workspaces/gamequeer --user "$(id -u)":"$(id -g)" \
            gamequeer-builder:latest \
            /bin/bash -c "cd gqc && pip install -q -e '.[test]' && python -m pytest tests"

      - name: Regenerate golden fixtures
        # `make golden-fixture` doesn't cover led_handback.gq or
        # examples/games/tutorial_1.gq (neither is wired into that Makefile
        # target), so those two are regenerated here directly, the same way
        # the Makefile recipe compiles its own asset-bearing fixtures: cd
        # into the fixture's own directory so gqc resolves its animation/
        # lightcue asset paths relative to that CWD.
        run: |
          make golden-fixture
          docker run --rm --workdir /workspaces/gamequeer/gamequeer/tests/golden \
            -v "$PWD":/workspaces/gamequeer --user "$(id -u)":"$(id -g)" \
            gamequeer-builder:latest \
            /bin/bash -c "PYTHONPATH=/workspaces/gamequeer/gqc/src python -m gqc compile --no-mem-map -o . led_handback.gq"
          docker run --rm --workdir /workspaces/gamequeer/examples \
            -v "$PWD":/workspaces/gamequeer --user "$(id -u)":"$(id -g)" \
            gamequeer-builder:latest \
            /bin/bash -c "PYTHONPATH=/workspaces/gamequeer/gqc/src python -m gqc compile --no-mem-map -o games games/tutorial_1.gq"

      - name: Fail on committed source/cart drift
        # If any regenerated .gqgame differs from what's committed, either a
        # .gq fixture was edited without regenerating its cart, or gqc's
        # output changed -- either way the golden suite above just compared
        # against a stale reference, and that should fail loudly here.
        run: git diff --exit-code -- gamequeer/tests/golden examples/games/tutorial_1.gqgame
