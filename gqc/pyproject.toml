[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gqc"
version = "0.0.1"
authors = [
  { name="George Louthan", email="duplico@dupli.co" },
]
description = "Gamequeer compiler package"
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0",
    "pyparsing>=3.1",
    "rich>=13.7",
    "webcolors>=24.6.0",
    "ffmpeg-python>=0.2",
    "pillow>=10.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[project.scripts]
gqc = "gqc.gqc:gqc_cli"

[project.urls]
Homepage = "https://github.com/duplico/gamequeer"
Issues = "https://github.com/duplico/gamequeer/issues"

[tool.pytest.ini_options]
markers = [
    "ffmpeg: needs a real ffmpeg binary on PATH (present in the gamequeer builder image)",
    "golden: byte-exact compiled-output regression tests (see gamequeer#333)",
]
